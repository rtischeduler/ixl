<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="./embed.css">
    <script src="./sealjet/sealjet.js" defer></script>
    <script src="./sealjet/sealjet.api.js" defer></script>
    <script type="module" src="./embed.js"></script>
  </head>
  <body>
    <main id="korona-runtime-root">
      <section id="runtime-stage" aria-live="polite">
        <div class="runtime-card">
          <span class="runtime-eyebrow">Secure Runtime</span>
          <strong>K-STUFF</strong>
          <div class="runtime-line" aria-hidden="true"></div>
          <p id="runtime-message">Preparing secure browser runtime…</p>
        </div>
      </section>
      <iframe id="runtime-frame" title="K-STUFF browser" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
    </main>
  </body>
</html>
