<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed;top:0;left:0" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <body xmlns="http://www.w3.org/1999/xhtml" style="margin:0">
      <iframe id="korona-runtime" data-runtime-sentinel="korona-runtime-root" title="Korona" allow="fullscreen; autoplay; clipboard-read; clipboard-write" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
      <script><![CDATA[(function(){
        var frame=document.getElementById("korona-runtime");
        var params=new URLSearchParams(location.search);
        function unpack(value){if(!value||value.length>12000||!/^[A-Za-z0-9_-]+$/.test(value))return null;try{var normalized=value.replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(atob(normalized+"=".repeat((4-normalized.length%4)%4)))}catch(error){return null}}
        var launch={target:unpack(params.get("target")),wisps:unpack(params.get("wisps")),apiOrigin:unpack(params.get("api"))};
        var base=new URL("./",location.href).href;
        var escapedBase=base.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
        var serialized=JSON.stringify(launch).replace(/</g,"\u003c");
        var injected='<base href="'+escapedBase+'"><script>window.__KORONA_RUNTIME_LAUNCH__='+serialized+';<\/script>';
        var fallback='<!doctype html><html><head><meta charset="utf-8">'+injected+'</head><body style="margin:0;background:#0a0a0d;color:#f5f5f7;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh"><p>Unable to load the runtime shell.</p></body></html>';
        fetch(new URL("./embed.html",location.href),{cache:"no-store"}).then(function(response){
          if(!response.ok)throw new Error("embed.html request failed");
          return response.text();
        }).then(function(html){
          frame.srcdoc=html.replace(/<head(\s[^>]*)?>/i,function(head){return head+injected});
        }).catch(function(){
          frame.srcdoc=fallback;
        });
        window.addEventListener("message",function(event){var data=event.data||{};if(event.source!==frame.contentWindow||data.type!=="korona-runtime")return;if(window.parent!==window)window.parent.postMessage(data,"*")});
      })()]]></script>
    </body>
  </foreignObject>
</svg>
